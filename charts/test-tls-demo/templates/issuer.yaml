# A namespaced, disposable Issuer using cert-manager's own `selfSigned`
# type - deliberately NOT the real letsencrypt-route53 ClusterIssuer this
# cluster also has configured (production ACME + real Route53 credentials
# - see charts/test-tls-demo/Chart.yaml). SelfSigned needs no external ACME/DNS
# call at all, so issuance is real, instant, and carries zero rate-limit
# or shared-infrastructure risk.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "test-tls-demo.fullname" . }}
  labels:
    {{- include "test-tls-demo.labels" . | nindent 4 }}
spec:
  selfSigned: {}
