apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "test-rest-api.fullname" . }}
  labels:
    {{- include "test-rest-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "test-rest-api.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "test-rest-api.labels" . | nindent 8 }}
      annotations:
        # Kubernetes does not restart a pod just because a referenced
        # ConfigMap's data changed - the pod template itself is
        # unchanged, so `helm upgrade` would silently no-op on the
        # running pod otherwise. Forces a real rollout whenever the app's
        # actual source changes.
        checksum/app-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: rest-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              set -e
              pip install --no-cache-dir \
                fastapi=={{ .Values.pipVersions.fastapi }} \
                "uvicorn[standard]"=={{ .Values.pipVersions.uvicorn }} \
                "python-multipart"=={{ .Values.pipVersions.pythonMultipart }} \
                bcrypt=={{ .Values.pipVersions.bcrypt }} \
                cryptography=={{ .Values.pipVersions.cryptography }} \
                "python-jose[cryptography]"=={{ .Values.pipVersions.pythonJose }}
              {{- if .Values.tls.enabled }}
              # Additive, not a replacement - the plain-HTTP listener
              # below (still what the startup/readiness/liveness probes
              # use) keeps running in the background exactly as without
              # TLS; a second real uvicorn process terminates real TLS
              # using uvicorn's own native --ssl-keyfile/--ssl-certfile
              # flags against the cert-manager-issued Secret mounted at
              # /tls. `exec` on the last process so it becomes the
              # container's PID 1 and receives signals correctly.
              uvicorn main:app --host 0.0.0.0 --port {{ .Values.service.port }} --app-dir /app &
              exec uvicorn main:app --host 0.0.0.0 --port {{ .Values.tls.port }} --app-dir /app \
                --ssl-keyfile /tls/tls.key --ssl-certfile /tls/tls.crt
              {{- else }}
              exec uvicorn main:app --host 0.0.0.0 --port {{ .Values.service.port }} --app-dir /app
              {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            {{- if .Values.tls.enabled }}
            - name: https
              containerPort: {{ .Values.tls.port }}
            {{- end }}
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /tls
              readOnly: true
            {{- end }}
          # Real, uncached `pip install` over the network runs before
          # this ever succeeds - the startup probe's own budget
          # (periodSeconds * failureThreshold) has to absorb that real
          # time, calibrated from an actual observed pod start, not
          # guessed (see values.yaml's comment and the chart README).
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: app
          configMap:
            name: {{ include "test-rest-api.fullname" . }}-app
        # Read-write, unlike the ConfigMap-mounted `app` volume - real
        # bytes uploaded via /files/* live here. emptyDir on purpose:
        # disposable test fixture, nothing here needs to survive a pod
        # restart.
        - name: data
          emptyDir:
            sizeLimit: 256Mi
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ include "test-rest-api.fullname" . }}-tls
        {{- end }}
