apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "test-nginx.fullname" . }}-test-connection"
  labels:
    {{- include "test-nginx.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed
spec:
  containers:
    - name: wget
      image: busybox
      command: ["wget"]
      args: ["-qO-", "{{ include "test-nginx.fullname" . }}:{{ .Values.service.port }}"]
  restartPolicy: Never
