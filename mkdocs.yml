site_name: Thomas BDD Harness
site_description: Real-command BDD testing for Helm, Kubernetes, and HTTP services.
site_url: https://alexanderilyin.github.io/Thomas/
repo_url: https://github.com/alexanderilyin/Thomas
repo_name: alexanderilyin/Thomas
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Concepts:
      - Getting started: getting-started.md
      - Architecture: architecture.md
      - BDD conventions: bdd-conventions.md
  - Reference:
      - Aliases: ALIASES.md
      - Helm: HELM.md
      - Kubernetes: KUBECTL.md
      - REST: REST.md
  - Project:
      - Fixtures and charts: fixtures.md
      - Installing Thomas: installing.md
      - Development: development.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - navigation.path
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    - toc.follow
    - header.autohide
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.action.edit
    - content.action.view
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
