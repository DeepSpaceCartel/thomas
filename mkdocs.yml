site_name: Thomas | Trust but Verify
site_description: Real-command BDD testing for Helm, Kubernetes, and HTTP services.
site_url: https://alexander.ilyin.eu/Thomas/
repo_url: https://github.com/DeepSpaceCartel/thomas
repo_name: DeepSpaceCartel/thomas
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Concepts:
      - Installing Thomas: concepts/installing.md
      - Architecture: concepts/architecture.md
      - BDD conventions: concepts/bdd-conventions.md
  - Reference:
      - Resources: reference/RESOURCES.md
      - Helm: reference/HELM.md
      - Kubernetes: reference/KUBECTL.md
      - REST: reference/REST.md
  - Project:
      - Getting started: project/getting-started.md
      - Fixtures and charts: project/fixtures.md
      - Development: project/development.md
      - CI: project/ci.md
      - Releasing: project/releasing.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - navigation.path
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    - toc.follow
    - header.autohide
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.action.edit
    - content.action.view
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
