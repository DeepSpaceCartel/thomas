name: real-tests

# Runs the actual (no-mocks) Cucumber suite against a real cluster —
# unlike ci.yaml's `cucumber-js --dry-run`, this really deploys and
# tears down real Helm releases in thomas-helm-test. Needs a
# self-hosted runner living inside that cluster (GitHub-hosted runners
# have no network path to it) — see docs/project/ci.md. The runner pod
# authenticates via its own in-cluster ServiceAccount identity (RBAC
# bound directly to the pod, provisioned cluster-side); no kubeconfig
# secret needed.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: real-tests
  cancel-in-progress: false # thomas-helm-test is one shared, fixed namespace — never run two suites against it at once

jobs:
  test:
    # Never runs for a fork PR - the runner pod's in-cluster identity
    # has real write access to the cluster, and a fork PR's workflow
    # run is not something we trust with that.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: thomas
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # scripts/tools.sh is the single source of truth for tool
      # versions - the same script a contributor runs locally via `npm
      # run install:tools`, so CI and dev never silently drift onto
      # different major versions of helm/kubectl again (see
      # docs/project/ci.md for the real incident that motivated this).
      - name: Install latest helm/kubectl
        run: |
          npm run install:tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: npm install
      # Excludes @requires-broad-rbac (currently just quickstart.feature)
      # - the CI ServiceAccount is intentionally scoped to
      # thomas-helm-test only (see docs/project/ci.md), and that
      # scenario deliberately deploys into a different namespace on
      # purpose. Still runs locally for anyone with broader access.
      - run: npm run test:verbose -- --tags "not @requires-broad-rbac"

      # TODO: I think namespace should be unique per run, not a fixed thomas-helm-test,
      # to avoid collisions if we ever do allow concurrent runs. But that would require
      # more complex SA and RBAC setup, so for now we just serialize all runs and use a fixed namespace.
      - name: Uninstall any releases this run left behind
        if: always()
        run: |
          for r in $(helm list -n thomas-helm-test -q); do
            helm uninstall "$r" -n thomas-helm-test || true
          done

      # Every scenario's full, untruncated command output (see
      # features/support/command_log.ts) - published every run, not
      # just on failure, so a passing run's real output is just as
      # inspectable as a failing one's.
      - name: Publish scenario logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-logs
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
