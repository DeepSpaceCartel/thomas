name: real-tests

# Runs the actual (no-mocks) Cucumber suite against a real cluster —
# unlike ci.yaml's `cucumber-js --dry-run`, this really deploys and
# tears down real Helm releases in thomas-helm-test. Needs a
# self-hosted runner living inside that cluster (GitHub-hosted runners
# have no network path to it) and a namespace-scoped kubeconfig secret
# — neither exists yet; provisioning them is a separate, cluster-side
# step (see docs/project/ci.md). This workflow is inert until both do.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: real-tests
  cancel-in-progress: false # thomas-helm-test is one shared, fixed namespace — never run two suites against it at once

jobs:
  test:
    # Never runs for a fork PR: GitHub already withholds secrets from
    # pull_request (not pull_request_target) runs triggered by a fork,
    # so THOMAS_CI_KUBECONFIG would just be empty there — this check
    # makes that an explicit, readable skip instead of a confusing
    # empty-secret failure.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: thomas
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: azure/setup-kubectl@v5
      - uses: azure/setup-helm@v5

      - name: Write kubeconfig
        run: |
          umask 077
          echo "${{ secrets.THOMAS_CI_KUBECONFIG }}" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - run: npm install
      - run: npm test

      - name: Uninstall any releases this run left behind
        if: always()
        run: |
          for r in $(helm list -n thomas-helm-test -q); do
            helm uninstall "$r" -n thomas-helm-test || true
          done
