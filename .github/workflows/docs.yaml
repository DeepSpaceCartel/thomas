name: docs

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # only needed to delete a stale artifact on a re-run, see below

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --upgrade pip
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict

      # deploy-pages fails with "Multiple artifacts named github-pages
      # were unexpectedly found" if this workflow is ever re-run
      # ("Re-run failed jobs") - upload-pages-artifact re-uploads under
      # the same name on the new attempt without the previous attempt's
      # artifact ever being cleaned up. A no-op on a normal (first
      # attempt) run - only fires on an actual re-run, which is exactly
      # when the collision can happen.
      - name: Remove any github-pages artifact from a previous attempt
        if: github.run_attempt != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' |
            while read -r id; do
              echo "Deleting stale github-pages artifact $id from a previous attempt"
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
            done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
